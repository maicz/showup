spring:
  application:
    name: showup-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/showup}
    username: ${DB_USERNAME:showup}
    password: ${DB_PASSWORD:showup}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

showup:
  security:
    jwt:
      # HS256 needs >= 32 bytes. The default is a development-only key: the app refuses to start
      # with it once a profile other than "default" or "test" is active. Set JWT_SECRET in real
      # environments.
      secret: ${JWT_SECRET:dev-only-insecure-signing-key-change-me-32B+}
      ttl: ${JWT_TTL:PT12H}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
