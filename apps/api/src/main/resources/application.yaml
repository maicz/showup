spring:
  application:
    name: showup-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/showup}
    username: ${DB_USERNAME:showup}
    password: ${DB_PASSWORD:showup}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
