spring:
  application:
    name: showup-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/showup}
    username: ${DB_USERNAME:showup}
    password: ${DB_PASSWORD:showup}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

showup:
  security:
    jwt:
      # A signing secret is mandatory in every runnable environment. Keep it out of source
      # control and use a high-entropy value of at least 32 bytes.
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:PT12H}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
